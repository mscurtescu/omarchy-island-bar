# Lefthook owns .git/hooks. Beads is invoked from here instead of
# `bd hooks install`, which would replace these shims.
pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: mise exec -- task lint
      glob: "*"
    - name: validate
      run: mise exec -- task validate
      glob: "*"
    - name: beads
      run: mise exec -- bd hooks run pre-commit
      glob: "*"

post-merge:
  jobs:
    - name: beads
      run: mise exec -- bd hooks run post-merge {1}

pre-push:
  jobs:
    - name: beads
      run: mise exec -- bd hooks run pre-push

post-checkout:
  jobs:
    - name: beads
      run: mise exec -- bd hooks run post-checkout {1} {2} {3}

prepare-commit-msg:
  jobs:
    - name: beads
      run: mise exec -- bd hooks run prepare-commit-msg {1} {2} {3}
